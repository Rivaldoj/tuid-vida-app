apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    defaultConfig {
        compileSdkVersion 36
        applicationId "com.autenticar.tuid"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 91
        versionName "3.0.1"
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true


    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        compose true
    }
    namespace 'com.autenticar.tuid'

    // Firma: se lee de keystore.properties (no versionado). Sin ese archivo, el release sale sin firmar.
    // Backend Vida v2: URL y token de la marca blanca desde vida.properties (no versionado)
    def vidaPropsFile = rootProject.file('vida.properties')
    def vidaProps = new Properties()
    if (vidaPropsFile.exists()) vidaPropsFile.withInputStream { vidaProps.load(it) }
    defaultConfig {
        // -PvidaBaseUrl=http://127.0.0.1:3003/vida/v2 permite apuntar una prueba al servidor local sin tocar vida.properties
        buildConfigField 'String', 'VIDA_BASE_URL', '"' + (project.findProperty('vidaBaseUrl') ?: vidaProps.getProperty('baseUrl', 'https://api.autenticartuid.com/vida/v2')) + '"'
        buildConfigField 'String', 'VIDA_TOKEN', '""'
        // Play Integrity: numero del proyecto de Google Cloud vinculado en Play Console (0 = desactivado)
        buildConfigField 'long', 'PLAY_CLOUD_PROJECT', vidaProps.getProperty('playCloudProject', '0') + 'L'
        // true: la app identifica por CUIL (selector de usuarios, aviso de ya registrado, actualizar historial).
        // Solo activar cuando el backend ya tenga desplegados los cambios por CUIL. false = flujo anterior DNI + sexo.
        buildConfigField 'boolean', 'USE_CUIL_API', String.valueOf(project.findProperty('useCuilApi') ?: vidaProps.getProperty('useCuilApi', 'false'))
    }

    def keystorePropsFile = rootProject.file('keystore.properties')
    def keystoreProps = new Properties()
    if (keystorePropsFile.exists()) {
        keystorePropsFile.withInputStream { keystoreProps.load(it) }
        signingConfigs {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    // Prueba contra un servidor LOCAL (sin tocar produccion): ./gradlew assembleDebug -PlocalServer=true -PuseCuilApi=true
    if (project.hasProperty('localServer')) {
        sourceSets {
            debug {
                res.srcDir 'src/localserver/res'
            }
        }
    }

    buildTypes {
        debug {
            // El token solo se incluye en builds de debug por ahora
            buildConfigField 'String', 'VIDA_TOKEN', '"' + vidaProps.getProperty('token', '') + '"'
            // Misma firma que release: permite instalar el debug encima del release sin perder datos
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        release {
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }


    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/license.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/notice.txt'
        exclude 'META-INF/ASL2.0'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/proguard/androidx-annotations.pro'
        exclude 'META-INF/versions/9/OSGI-INF/MANIFEST.MF'
        exclude 'META-INF/versions/**/OSGI-INF/MANIFEST.MF'
        exclude 'META-INF/LICENSE.md'
        exclude 'META-INF/NOTICE.md'
        exclude 'META-INF/LICENSE-notice.md'
        exclude 'META-INF/versions/**'
    }
    useLibrary 'org.apache.http.legacy'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'

    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'

    implementation 'de.hdodenhof:circleimageview:2.1.0'
    implementation 'androidx.work:work-runtime:2.9.1'

    //gif implementation
    implementation 'pl.droidsonroids.gif:android-gif-drawable:1.2.16'
    implementation 'com.google.android.gms:play-services-maps:18.2.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.play:integrity:1.4.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test:runner:1.1.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'

    // CameraX
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    // ML Kit (reemplaza a Firebase ML Vision)
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
    implementation 'com.google.mlkit:object-detection:17.0.2'

    // AWS Rekognition Face Liveness (Amplify UI, Kotlin + Compose)
    implementation 'com.amplifyframework.ui:liveness:1.13.0'
    implementation 'com.amplifyframework:aws-auth-cognito:2.43.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'com.google.guava:guava:33.4.8-android'
    implementation platform('androidx.compose:compose-bom:2026.06.00')
    implementation 'androidx.compose.material3:material3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // Lectura NFC de documentos electronicos (OACI 9303: pasaporte / nuevo DNI). Solo debug por ahora.
    debugImplementation 'org.jmrtd:jmrtd:0.8.9'
    debugImplementation 'net.sf.scuba:scuba-sc-android:0.0.27'
    debugImplementation 'dev.keiji.jp2:jp2-android:1.0.5'

    //GLIDE
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    //

    //AMPLITUDE
    implementation 'com.amplitude:android-sdk:2.34.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    //
    implementation 'com.izettle:html2bitmap:1.9'
}


apply plugin: 'com.google.gms.google-services'